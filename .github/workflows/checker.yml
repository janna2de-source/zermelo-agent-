name: Zermelo Rooster Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 3-20 * * *'

permissions:
  contents: write

concurrency:
  group: zermelo
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Tijd controleren
        id: tijd
        run: |
          UUR=$((10#$(TZ=Europe/Amsterdam date +%H)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$UUR" -ge 5 ] && [ "$UUR" -lt 21 ]; }; then
            echo "actief=ja" >> "$GITHUB_OUTPUT"
          else
            echo "Buiten 05:00-21:00 (uur: $UUR), overslaan."
            echo "actief=nee" >> "$GITHUB_OUTPUT"
          fi

      - name: Code ophalen
        if: steps.tijd.outputs.actief == 'ja'
        uses: actions/checkout@v4

      - name: Python instellen
        if: steps.tijd.outputs.actief == 'ja'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Script uitvoeren
        if: steps.tijd.outputs.actief == 'ja'
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python rooster_checker.py

      - name: State opslaan
        if: steps.tijd.outputs.actief == 'ja'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          [ -f state.json ] && git add state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Update state"
            git pull --rebase
            git push
          fi
